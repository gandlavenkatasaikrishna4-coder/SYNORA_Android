name: SYNORA build and tests
on:
  push:
  workflow_dispatch:
jobs:
  kotlin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Run tests
        run: gradle test --console=plain
      - name: Show how many tests ran
        if: always()
        run: |
          ls build/test-results/test/*.xml
          grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' build/test-results/test/*.xml | tee -a "$GITHUB_STEP_SUMMARY"

  android-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Arrange the Android project from the flat files
        run: |
          mkdir -p android-build/app/src/main/kotlin
          cp android-settings.gradle.kts android-build/settings.gradle.kts
          cp android-root.gradle.kts android-build/build.gradle.kts
          cp android-gradle.properties android-build/gradle.properties
          cp android-app.gradle.kts android-build/app/build.gradle.kts
          cp AndroidManifest.xml android-build/app/src/main/AndroidManifest.xml
          cp MainActivity.kt SyncCore.kt android-build/app/src/main/kotlin/
      - name: Build the debug app
        working-directory: android-build
        run: gradle :app:assembleDebug --console=plain
      - name: Keep the app file
        uses: actions/upload-artifact@v4
        with:
          name: synora-debug-apk
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
